[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dynamic-subgraphs"
version = "0.3.0"
description = "A governed dynamic-graph runtime: a stable Supervisor plans, validates, and runs transient LangGraph workflows from a bounded node registry."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Ian Tharp", email = "praht09ian@gmail.com" }]
keywords = [
    "langgraph",
    "langchain",
    "llm",
    "agents",
    "workflow",
    "supervisor",
    "dynamic-graph",
    "orchestration",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

# Slim core — only what the engine imports eagerly. Provider SDKs and the
# FastAPI surface are optional extras below (their imports are already lazy).
dependencies = [
    "langgraph>=1.2.4",
    "langchain-core>=0.3",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.136.3", "uvicorn[standard]>=0.48.0"]
openai = ["langchain-openai>=1.2.2"]
anthropic = ["langchain-anthropic>=0.3.0"]
ollama = ["langchain-ollama>=0.2.0"]
# Automatic cost on RunResult via LiteLLM's maintained price map (no manual prices).
cost = ["litellm>=1.0"]
all = [
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.48.0",
    "langchain-openai>=1.2.2",
    "langchain-anthropic>=0.3.0",
    "langchain-ollama>=0.2.0",
    "litellm>=1.0",
]

[project.urls]
Homepage = "https://github.com/Ian-Tharp/Dynamic-Subgraphs"
Repository = "https://github.com/Ian-Tharp/Dynamic-Subgraphs"
Issues = "https://github.com/Ian-Tharp/Dynamic-Subgraphs/issues"
Documentation = "https://github.com/Ian-Tharp/Dynamic-Subgraphs/tree/develop/docs"

# Dev tooling (PEP 735 group; installed by `uv sync` by default).
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.28.1",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["dynamic_subgraphs", "app"]

[tool.hatch.build.targets.wheel.force-include]
"dynamic_subgraphs/py.typed" = "dynamic_subgraphs/py.typed"
"app/py.typed" = "app/py.typed"

[tool.hatch.build.targets.sdist]
exclude = [
    "runs",
    "tests",
    "examples",
    "**/__pycache__",
    "*.pyc",
    "uv.lock",
    ".github",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers --strict-config -ra"
markers = [
    "integration: hits a real LLM/network; needs DS_RUN_INTEGRATION=1 (and OPENAI_API_KEY)",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"] # line length is owned by the formatter

[tool.ruff.lint.per-file-ignores]
# Tests use intentional patterns ruff flags as nits (blind excepts, regex
# match= strings, mutable helper attrs).
"tests/*" = ["B011", "SIM", "B017", "RUF012", "RUF043"]
# Examples load_dotenv() before importing the SDK, so imports aren't top-of-file.
"examples/*" = ["E402"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "dynamic_subgraphs.*"
strict = true

[[tool.mypy.overrides]]
module = ["app.*"]
disallow_untyped_defs = false

# Incrementally bringing app under strict typing — models + registry are clean.
[[tool.mypy.overrides]]
module = ["app.models.*", "app.registry.*"]
strict = true

[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_errors = true

[tool.coverage.run]
source = ["dynamic_subgraphs", "app"]
branch = true
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
