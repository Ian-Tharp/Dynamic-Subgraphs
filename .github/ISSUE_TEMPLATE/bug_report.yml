name: Bug report
description: Report a problem with Dynamic Subgraphs
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Minimal code/steps to reproduce. Include the EngineConfig and prompt if relevant.
      render: python
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: dynamic-subgraphs version (and how installed).
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Model provider
      options:
        - mock (offline)
        - openai
        - anthropic
        - ollama / LM Studio (local)
        - other / openai-compatible
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: Python version + OS.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / traceback
      description: Paste any error output. Do NOT include API keys.
      render: shell
