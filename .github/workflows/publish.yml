name: Publish to PyPI

# Tag a release to publish, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
#
# Uses PyPI Trusted Publishing (OIDC) — no API token/secret. Before the first
# run, register this repo + workflow as a Trusted Publisher on PyPI:
#   https://pypi.org/manage/account/publishing/
#   (project: dynamic-subgraphs, workflow: publish.yml, environment: pypi)

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync --all-extras --frozen
      - name: Test (non-integration)
        run: uv run pytest -m "not integration"
      - name: Build wheel + sdist
        run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dynamic-subgraphs
    permissions:
      id-token: write # OIDC token for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
