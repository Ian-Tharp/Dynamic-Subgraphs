name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Full Python-version coverage on Linux + Windows; one macOS smoke job
        # on the latest Python (pure-Python lib — mac behaves like Linux, this
        # just catches path/filesystem quirks without tripling the matrix).
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.13"
    steps:
      # Using major-version tags for a reliable first run; pin to commit SHAs
      # (e.g. via dependabot or `pinact`) as a security-hardening follow-up.
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Sync (all extras + dev)
        run: uv sync --all-extras --frozen
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Ruff lint
        run: uv run ruff check .
      - name: Mypy (strict — public package + governance, models, registry)
        run: uv run mypy dynamic_subgraphs app/policy.py app/models app/registry
      - name: Tests
        # The 6 integration tests auto-skip without DS_RUN_INTEGRATION/keys,
        # so no secrets are referenced anywhere in this workflow.
        run: uv run pytest -m "not integration"

  build:
    name: build + install smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Build wheel + sdist
        run: uv build
      - name: Install the built wheel into a clean venv and import
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/python -m pip install --upgrade pip
          /tmp/smoke/bin/python -m pip install dist/*.whl
          /tmp/smoke/bin/python -c "import dynamic_subgraphs as d; print('import ok:', sorted(d.__all__))"
      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
